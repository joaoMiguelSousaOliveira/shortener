<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/index.css">
    <title>URLshortener</title>
</head>
<body>

    <div class="main-container">
        <div class="logo-area">
            <svg class="pear-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M16.5,19.5 C16.5,21.5 14,22.5 12,22.5 C10,22.5 7.5,21.5 7.5,19.5 C7.5,16.5 9,14.5 10.5,12 C11.5,10.5 11,9 10.5,8 C10,7 10.5,5.5 11.5,4.5 C12,4 12.5,4 13,4.5 C14,5.5 14,7 13.5,8 C13,9 12.5,10.5 13.5,12 C15,14.5 16.5,16.5 16.5,19.5 Z M 13,4.5 C 13,4.5 14,2 16,1.5" stroke="none" />
            </svg>
            <div class="logo-text">URL<span>SHORTENER</span></div>    
        </div>
       
        <div class="span-class">Compartilhe hoje</div>
        
        <h1>Encurte. Compartilhe.<br>Simples assim.</h1>
        <p class="subtitle">Cole seu link longo abaixo e pegue sua versão curta e fresca.</p>
        <form>

            <div class="input-wrapper">
            <svg class="link-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>

            <input type="input" placeholder="Cole sua URL longa aqui...">

            <button type="submit" id="short-btn">Encurtar</button>
        </div>

        <div id="result" class="result" style="display: none;">
            <p id="result-text"></p>
            <button id="copy-btn" class="copy-btn">Copiar</button>
        </div>

        </form>
    </div>

    <div class="footer">
        © 2025 URLSHORTENER. Feito com frescor.
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
